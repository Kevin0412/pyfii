[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfii-gui-api"
dynamic = ["version"]
description = "FastAPI adapter for the standalone Pyfii GUI prototype."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.2",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.31",
  "pydantic>=2.4",
  "orjson>=3.11.6",
  "pyfii>=1.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pyfii_gui_api.__version__"}
