name: Render screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - "src/pyfii/**"
      - "apps/pyfii-gui/**"
      - "pyproject.toml"
      - "tests/dntg20220730_v3.py"
      - "tests/function.py"
      - ".github/scripts/render-screenshots.py"
      - ".github/workflows/render-screenshots.yml"
  pull_request:
    paths:
      - "src/pyfii/**"
      - "apps/pyfii-gui/**"
      - "pyproject.toml"
      - "tests/dntg20220730_v3.py"
      - "tests/function.py"
      - ".github/scripts/render-screenshots.py"
      - ".github/workflows/render-screenshots.yml"

permissions:
  contents: read

concurrency:
  group: render-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Screenshots (${{ matrix.sample }})
    strategy:
      fail-fast: false
      matrix:
        sample: [smoke, dntg]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      PYFII_GUI_TRAJECTORY_WORKERS: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/pyfii-gui/frontend/package-lock.json
      - name: Install core and GUI backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 fonts-noto-cjk
          python -m pip install -e . -e apps/pyfii-gui/backend playwright
      - name: Generate OpenCV screenshots and shared project
        run: python .github/scripts/render-screenshots.py core --sample ${{ matrix.sample }}
      - name: Install frontend dependencies
        working-directory: apps/pyfii-gui/frontend
        run: npm ci
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Capture browser screenshots
        env:
          VITE_API_PROXY_TARGET: http://127.0.0.1:8000
          PYFII_GUI_RUNTIME_DIR: ${{ runner.temp }}/pyfii-runtime
        run: |
          mkdir -p render-artifacts
          python -m uvicorn pyfii_gui_api.main:app --host 127.0.0.1 --port 8000 > render-artifacts/backend.log 2>&1 &
          backend_pid=$!
          npm --prefix apps/pyfii-gui/frontend run dev -- --host 127.0.0.1 --strictPort > render-artifacts/frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for url in http://127.0.0.1:8000/api/health http://127.0.0.1:5173/studio; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent "$url" >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent --show-error "$url" >/dev/null
          done
          python .github/scripts/render-screenshots.py browser
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: render-screenshots-${{ matrix.sample }}
          path: |
            render-artifacts/*.png
            render-artifacts/fixture.zip
            render-artifacts/fixture.json
            render-artifacts/*.log
          if-no-files-found: error
          retention-days: 14

  publish-gallery:
    name: Publish screenshot gallery
    needs: screenshots
    if: github.ref == 'refs/heads/pyfii-dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: render-screenshots-*
          path: ${{ runner.temp }}/gallery-artifacts
      - name: Publish PNGs to generated branch
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/gallery-artifacts
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for sample in dntg smoke; do
            source_dir="$ARTIFACT_DIR/render-screenshots-$sample"
            test -f "$source_dir/fixture.json"
            expected=6
            if [ "$sample" = dntg ]; then expected=42; fi
            actual=$(find "$source_dir" -maxdepth 1 -name '*.png' -type f | wc -l)
            test "$actual" -eq "$expected"
          done
          branch=render-gallery
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            git fetch --depth=1 origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch -c "$branch" --track "origin/$branch"
          else
            git switch --orphan "$branch"
          fi
          git rm -r --ignore-unmatch -- dntg smoke
          for sample in dntg smoke; do
            mkdir -p "$sample"
            source_dir="$ARTIFACT_DIR/render-screenshots-$sample"
            cp "$source_dir"/*.png "$source_dir/fixture.json" "$sample/"
          done
          {
            echo '# PyFii generated rendering screenshots'
            echo
            echo 'This branch is maintained by the Render screenshots workflow.'
            echo
            echo "Source commit: [$SOURCE_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$SOURCE_SHA)"
            echo
            echo "Workflow run: $RUN_URL"
            echo
            echo "[Visual gallery](https://github.com/$GITHUB_REPOSITORY/blob/pyfii-dev/docs/render-gallery.md)"
          } > README.md
          git add README.md dntg smoke
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "docs: publish renders for $SOURCE_SHA"
          git push origin "HEAD:refs/heads/$branch"
