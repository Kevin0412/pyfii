name: Documentation checks

on:
  push:
    paths:
      - "doc/**"
      - "docs/**"
      - "README.md"
      - "tests/test_frontend_docs.py"
      - "apps/pyfii-gui/frontend/**"
      - ".github/workflows/documentation-checks.yml"
  pull_request:
    paths:
      - "doc/**"
      - "docs/**"
      - "README.md"
      - "tests/test_frontend_docs.py"
      - "apps/pyfii-gui/frontend/**"
      - ".github/workflows/documentation-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_frontend_docs.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/pyfii-gui/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/pyfii-gui/frontend
      - run: npm run typecheck
        working-directory: apps/pyfii-gui/frontend
      - run: npm run build
        working-directory: apps/pyfii-gui/frontend
